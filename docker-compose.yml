services:
  mcp-client-python:
    build:
      context: ./mcp-client-python
    container_name: mcp-client-python
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AI_SERVICE_URL=http://ai-service-fastapi:8000
      - MCP_SERVER_URL=http://mcp-server-rust:8080/mcp
      # mcp-server-rust speaks the older HTTP+SSE transport, not Streamable
      # HTTP, so the SDK has to be told -- it does not fall back on its own.
      - MCP_TRANSPORT=${MCP_TRANSPORT:-sse}
      - POLL_INTERVAL_SECONDS=60
      # LLM_PROVIDER picks which model drives the label/move decision loop.
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-opus-5}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://ollama.com}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gpt-oss:20b}
      - OLLAMA_FORMAT_MODE=${OLLAMA_FORMAT_MODE:-json}
      - OLLAMA_THINK=${OLLAMA_THINK:-low}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-30}
    depends_on:
      - mcp-server-rust
      - ai-service-fastapi

  mcp-server-rust:
    build:
      context: ./mcp-server-rust
    container_name: mcp-server-rust
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      # Legacy Single-User Fallbacks (Optional once DB is populated)
      - IMAP_SERVER=${IMAP_SERVER:-imap.gmail.com}
      - IMAP_USER=${IMAP_USER}
      - IMAP_PASS=${IMAP_PASS}
      # Database Connection
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/mcp_db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mcp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service-fastapi:
    build:
      context: ./ai-service-fastapi
    container_name: ai-service-fastapi
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # Ollama is an external API, not a service we run. Point OLLAMA_BASE_URL
      # at a self-hosted daemon instead if you ever want one.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://ollama.com}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:?set OLLAMA_API_KEY in your .env}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gpt-oss:20b}
      - OLLAMA_FORMAT_MODE=${OLLAMA_FORMAT_MODE:-json}
      - OLLAMA_THINK=${OLLAMA_THINK:-low}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-9}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

volumes:
  postgres_data:
