[project]
name = "mcp-client"
version = "0.1.0"
description = "aguero"
readme = "README.md"
authors = [
    { name = "Mohammed", email = "nokrymohammed342@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.122.0",
    "mcp>=2.0.0",
    "python-dotenv>=1.2.3",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
mcp-client = "mcp_client:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
