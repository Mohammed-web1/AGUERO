[project]
name = "aguero-ai-service"
version = "0.1.0"
description = "Email threat, urgency and category classification for the AGUERO platform"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
# The ranges, not the compiled pins: package metadata should state what the
# service is compatible with, while requirements.txt states what a given image
# actually installs.
dependencies = { file = ["requirements.in"] }

[tool.pytest.ini_options]
# Lets `pytest` find the `app` package from this directory, so tests need no
# sys.path juggling of their own.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py311"
